[project]
name = "fily"
version = "0.1.0"
description = "A private, self-hosted file organizer for macOS that tidies your Downloads every night and reports over Telegram."
readme = "README.md"
license = "MIT"
keywords = ["macos", "file-organizer", "telegram-bot", "gemini", "automation"]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.40.0",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "send2trash>=1.8",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
organize = "organizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["organizer"]
